# Datasource settings are supplied at runtime by AbstractIntegrationTest, which starts a
# throwaway MySQL container per test run. Nothing here may point at a real database.

spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.MySQLDialect

spring.jpa.open-in-view = false
spring.jpa.show-sql = true

# Throwaway HS256 signing key for tests only. Production reads JWT_SECRET from the
# environment and has no fallback, so this string must appear nowhere else.
jwt.secret = test-only-hs256-secret-not-used-in-production-0123456789
