spring.jackson.default-property-inclusion = non_empty

# DataSource settings: set here your own configurations for the database
# connection. In this example we have "sakila" as database name.
# See README.md for the docker run line that provides it.
spring.datasource.url = jdbc:mysql://localhost:3310/sakila?useSSL=false&serverTimezone=UTC
spring.datasource.username = travis
spring.datasource.password =

spring.jpa.open-in-view = false

# Show or not log for each sql query. Logs bound parameters too, so keep it off
# outside local development.
spring.jpa.show-sql = true

# Hibernate ddl auto (create, create-drop, update)
# spring.jpa.hibernate.ddl-auto = create

# Use spring.jpa.properties.* for Hibernate native properties (the prefix is
# stripped before adding them to the entity manager)

# The SQL dialect makes Hibernate generate better SQL for the chosen database
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.MySQLDialect

# HS256 signing key, resolved from the JWT_SECRET environment variable by relaxed
# binding. Deliberately not given a value here: this file is committed to git, so a
# literal default would be a published signing key. Startup fails without it.
#   JWT_SECRET=$(openssl rand -base64 48)

# Comma-separated origins allowed to call this API from a browser. Default is the
# Vite dev server; never widen this to "*".
# app.cors.allowed-origins = http://localhost:5173

server.port = 8181

# Never let a future tweak turn the error page into an information leak.
server.error.include-message = never
server.error.include-stacktrace = never

management.server.port = 8182
management.server.address = 127.0.0.1
